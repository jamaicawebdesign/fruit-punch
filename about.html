<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>About · Island Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="about">
<div id="site-header"></div>
<main class="wrap about">
  <h1>About Island Pulse</h1>
  <p>Island Pulse is an independent newsroom covering Jamaica and the wider Caribbean: politics, business, sport and the culture that makes the region unique.</p>
  <p>Our mission is to report with accuracy, context and heart for readers at home and across the diaspora.</p>
  <h2 id="contact" class="sec">Contact us</h2>
  <form onsubmit="event.preventDefault();this.innerHTML='<p>Thank you, we will be in touch.</p>'">
    <input required placeholder="Your name" aria-label="Name">
    <input type="email" required placeholder="Email" aria-label="Email">
    <textarea required rows="5" placeholder="Message" aria-label="Message"></textarea>
    <button>Send message</button>
  </form>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script><script src="js/app.js"></script>
</body>
</html>
